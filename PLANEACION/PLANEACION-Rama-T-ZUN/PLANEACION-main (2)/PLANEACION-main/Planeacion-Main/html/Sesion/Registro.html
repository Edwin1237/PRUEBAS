<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="../css/Registro.css">
</head>
<body>

    <div class="contenedor">

    <div class="Logo">
      <img src="../../assets/fashion.jpg" alt="Logo Fashion Style">
    </div>

    <div class="Formulario">
    <form id="formRegistro">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="email" id="email" placeholder="Correo Electrónico" required>
      <input type="text" id="telefono" placeholder="Telefono" required>
      <input type="password" id="password" placeholder="Crear Contraseña" required>
      <input type="password" id="confirmar" placeholder="Confirmar Contraseña" required>

      <button type="submit">Registrarse</button>
    </form>
  </div>
  <script src="../js/Registro.js"></script>
</body>
